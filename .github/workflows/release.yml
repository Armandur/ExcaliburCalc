name: Bygg och publicera release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installera mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Bygg launchern
        run: ./build.sh

      - name: Packa installationspaketet
        run: |
          mkdir -p package/dist
          cp dist/excalibur-launcher.exe package/dist/
          cp install.ps1 uninstall.ps1 README.md LICENSE package/
          cd package && zip -r ../ExcaliburCalc.zip .

      - name: Publicera release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ExcaliburCalc.zip \
            dist/excalibur-launcher.exe
